server {
 listen 443 ssl;
 server_name localhost;
 ssl_certificate /etc/nginx/tls/cert.pem;
 ssl_certificate_key /etc/nginx/tls/key.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 20m;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy same-origin always;
 location /api/ { proxy_pass http://api:8000; proxy_buffering off; proxy_read_timeout 600s; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
 location /docs { proxy_pass http://api:8000; }
 location /openapi.json { proxy_pass http://api:8000; }
 location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
}
