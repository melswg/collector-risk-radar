name: moscollector
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: moscollector
      POSTGRES_USER: moscollector
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make configure}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U moscollector']
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
  api:
    build: {context: .., dockerfile: deploy/Dockerfile}
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://moscollector:${POSTGRES_PASSWORD}@postgres/moscollector
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /app/data
      ML_URL: http://ml-service:8100
    command: [sh, -c, 'alembic upgrade head && uvicorn backend.api:app --host 0.0.0.0 --port 8000']
    volumes: [app_data:/app/data]
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    build: {context: .., dockerfile: deploy/Dockerfile}
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://moscollector:${POSTGRES_PASSWORD}@postgres/moscollector
      REDIS_URL: redis://redis:6379/0
      ML_URL: http://ml-service:8100
    command: [python, -m, backend.worker]
    volumes: [app_data:/app/data]
    depends_on: [api, redis]
  scheduler:
    build: {context: .., dockerfile: deploy/Dockerfile}
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://moscollector:${POSTGRES_PASSWORD}@postgres/moscollector
      REDIS_URL: redis://redis:6379/0
    command: [python, -m, backend.scheduler]
    depends_on: [api, redis]
  telegram-bot:
    build: {context: .., dockerfile: deploy/Dockerfile}
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://moscollector:${POSTGRES_PASSWORD}@postgres/moscollector
    command: [python, -m, backend.telegram_bot]
    volumes: [app_data:/app/data]
    profiles: [telegram]
    depends_on: [api]
  frontend:
    build: {context: .., dockerfile: deploy/frontend.Dockerfile}
    ports: ['127.0.0.1:8443:443']
    depends_on: [api]
  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: Moscollector Demo
      LDAP_DOMAIN: demo.moscollector.local
      LDAP_ADMIN_PASSWORD: ${LDAP_BIND_PASSWORD}
      LDAP_TLS: 'true'
    profiles: [ldap]
  mock-smvu-emulator:
    build: {context: .., dockerfile: deploy/Dockerfile}
    env_file: ../.env
    environment: {API_URL: 'http://api:8000'}
    command: [python, -m, tools.emulator.replay, --speed, '60']
    profiles: [demo]
    depends_on: [api]
  ml-service:
    build: {context: .., dockerfile: ml_service_template/Dockerfile}
    env_file: ../.env
    command: [uvicorn, ml_service_template.app:app, --host, 0.0.0.0, --port, '8100']
    volumes: [ml_data:/app/data]
    profiles: [ml]
volumes:
  postgres_data:
  redis_data:
  app_data:
  ml_data:
